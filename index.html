<title>Month Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --fg: #ffffff;
    --fg-muted: #555;
    --fg-mid: #888;
    --red: #e63030;
    --red-glow: rgba(230,48,48,0.3);
    --today-ring: rgba(255,255,255,0.35);
    color-scheme: dark;
    font-family: 'Outfit', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 390px;
    padding-bottom: 50px;
  }

  /* header */
  .top {
    padding-top: max(56px, env(safe-area-inset-top, 0px));
    padding-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  .nav-btn:active { background: #222; }
  .month-label {
    text-align: center;
    flex: 1;
  }
  .month-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .month-year {
    font-size: 0.78rem;
    color: var(--fg-muted);
    font-weight: 600;
    margin-top: 3px;
    letter-spacing: 0.06em;
  }

  /* progress bar */
  .progress-wrap {
    margin-bottom: 28px;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .progress-pct {
    font-size: 2rem;
    font-weight: 800;
    color: var(--red);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .progress-sub {
    font-size: 0.8rem;
    color: var(--fg-muted);
    font-weight: 600;
  }
  .bar-bg {
    height: 4px;
    background: var(--surface);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 4px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--red-glow);
  }

  /* weekday headers */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .wd {
    text-align: center;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    padding: 4px 0;
  }

  /* calendar grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 32px;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .day .num {
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1;
  }
  /* empty cell for offset */
  .day.empty { background: none; }

  /* past = red */
  .day.done {
    background: var(--red);
    box-shadow: 0 0 10px var(--red-glow);
  }
  .day.done .num { color: #fff; }

  /* today = white ring */
  .day.today-day {
    border: 2px solid var(--today-ring);
  }
  .day.today-day .num { color: var(--fg); }

  /* future = dim dot */
  .day.future-day {
    background: var(--surface);
  }
  .day.future-day .num { color: var(--fg-muted); }

  /* bottom note */
  .note {
    text-align: center;
    font-size: 0.78rem;
    color: var(--fg-muted);
    font-weight: 600;
    line-height: 1.6;
  }
  .note strong { color: var(--fg-mid); }
</style>

<div class="wrap">
  <div class="top">
    <button class="nav-btn" id="prev" aria-label="Previous month">‹</button>
    <div class="month-label">
      <div class="month-name" id="month-name"></div>
      <div class="month-year" id="month-year"></div>
    </div>
    <button class="nav-btn" id="next" aria-label="Next month">›</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-row">
      <div class="progress-pct" id="pct">0%</div>
      <div class="progress-sub" id="prog-sub"></div>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  </div>

  <div class="weekdays">
    <div class="wd">Su</div><div class="wd">Mo</div><div class="wd">Tu</div>
    <div class="wd">We</div><div class="wd">Th</div><div class="wd">Fr</div>
    <div class="wd">Sa</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="note" id="note"></div>
</div>

<script>
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }

  function render() {
    const today = new Date();
    const isCurrentMonth = (viewYear === today.getFullYear() && viewMonth === today.getMonth());
    const todayDate = today.getDate();
    const total = daysInMonth(viewYear, viewMonth);
    const firstDow = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun

    // header
    document.getElementById('month-name').textContent = MONTHS[viewMonth];
    document.getElementById('month-year').textContent = viewYear;

    // how many days are "done" (fully past)
    let doneDays = 0;
    if (viewYear < today.getFullYear()) {
      doneDays = total; // whole month is past
    } else if (viewYear === today.getFullYear() && viewMonth < today.getMonth()) {
      doneDays = total; // whole month is past
    } else if (isCurrentMonth) {
      doneDays = todayDate - 1; // only fully completed days
    } else {
      doneDays = 0; // future month
    }

    const pct = total > 0 ? Math.round((doneDays / total) * 100) : 0;
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('prog-sub').textContent = `${doneDays} of ${total} days`;

    // grid
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    // empty offset cells
    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= total; d++) {
      const el = document.createElement('div');
      el.className = 'day';
      el.innerHTML = `<span class="num">${d}</span>`;

      const isPast = (viewYear < today.getFullYear()) ||
                     (viewYear === today.getFullYear() && viewMonth < today.getMonth()) ||
                     (isCurrentMonth && d < todayDate);
      const isToday = isCurrentMonth && d === todayDate;

      if (isPast) {
        el.classList.add('done');
      } else if (isToday) {
        el.classList.add('today-day');
      } else {
        el.classList.add('future-day');
      }

      grid.appendChild(el);
    }

    // bottom note
    const note = document.getElementById('note');
    if (isCurrentMonth) {
      const left = total - todayDate;
      note.innerHTML = `<strong>${left} days</strong> remaining this month`;
    } else if (doneDays === total) {
      note.innerHTML = `Month complete`;
    } else {
      note.innerHTML = ``;
    }
  }

  document.getElementById('prev').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });
  document.getElementById('next').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  render();
</script>
