<title>Month Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #1c1c1c;
    --border: #2a2a2a;
    --fg: #ffffff;
    --fg-muted: #3a3a3a;
    --fg-dim: #666;
    --red: #e63030;
    --red-glow: rgba(230,48,48,0.3);
    color-scheme: dark;
    font-family: 'Outfit', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }

  html {
    height: 100%;
    height: -webkit-fill-available;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-top: max(18px, env(safe-area-inset-top, 0px));
    padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
  }

  /* month nav — fixed height */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    margin-bottom: 14px;
  }
  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .nav-btn:active { background: #2a2a2a; }
  .month-label { text-align: center; flex: 1; }
  .month-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .month-year {
    font-size: 0.68rem;
    color: var(--fg-dim);
    font-weight: 600;
    margin-top: 2px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* progress — fixed height */
  .progress-wrap {
    flex-shrink: 0;
    margin-bottom: 14px;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 7px;
  }
  .progress-pct {
    font-size: 2rem;
    font-weight: 800;
    color: var(--red);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .progress-sub {
    font-size: 0.72rem;
    color: var(--fg-dim);
    font-weight: 600;
  }
  .bar-bg {
    height: 3px;
    background: var(--surface);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 3px;
    transition: width 0.5s ease;
    box-shadow: 0 0 8px var(--red-glow);
  }

  /* weekdays — fixed height */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    flex-shrink: 0;
    margin-bottom: 5px;
  }
  .wd {
    text-align: center;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--fg-dim);
    padding: 2px 0;
  }

  /* grid — grows to fill remaining space */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    flex: 1;
    align-content: stretch;
  }
  .day {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .day .num {
    font-size: clamp(0.75rem, 4vw, 1rem);
    font-weight: 700;
    line-height: 1;
  }
  .day.empty { background: none; }
  .day.done {
    background: var(--red);
    box-shadow: 0 0 12px var(--red-glow);
  }
  .day.done .num { color: #fff; }
  .day.today-day { border: 2px solid rgba(255,255,255,0.35); }
  .day.today-day .num { color: var(--fg); }
  .day.future-day { background: var(--surface); }
  .day.future-day .num { color: var(--fg-muted); }

  .note {
    flex-shrink: 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--fg-dim);
    font-weight: 600;
    margin-top: 10px;
  }
  .note strong { color: #888; }
</style>

<div class="top">
  <button class="nav-btn" id="prev">‹</button>
  <div class="month-label">
    <div class="month-name" id="month-name"></div>
    <div class="month-year" id="month-year"></div>
  </div>
  <button class="nav-btn" id="next">›</button>
</div>

<div class="progress-wrap">
  <div class="progress-row">
    <div class="progress-pct" id="pct">0%</div>
    <div class="progress-sub" id="prog-sub"></div>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
</div>

<div class="weekdays">
  <div class="wd">Su</div><div class="wd">Mo</div><div class="wd">Tu</div>
  <div class="wd">We</div><div class="wd">Th</div><div class="wd">Fr</div>
  <div class="wd">Sa</div>
</div>

<div class="grid" id="grid"></div>
<div class="note" id="note"></div>

<script>
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function render() {
    const today = new Date();
    const isCurrentMonth = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    const todayDate = today.getDate();
    const total = daysInMonth(viewYear, viewMonth);
    const firstDow = new Date(viewYear, viewMonth, 1).getDay();

    document.getElementById('month-name').textContent = MONTHS[viewMonth];
    document.getElementById('month-year').textContent = viewYear;

    let doneDays = 0;
    if (viewYear < today.getFullYear() || (viewYear === today.getFullYear() && viewMonth < today.getMonth())) {
      doneDays = total;
    } else if (isCurrentMonth) {
      doneDays = todayDate - 1;
    }

    const pct = total > 0 ? Math.round((doneDays / total) * 100) : 0;
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('prog-sub').textContent = doneDays + ' of ' + total + ' days';

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDow; i++) {
      const e = document.createElement('div');
      e.className = 'day empty';
      grid.appendChild(e);
    }

    for (let d = 1; d <= total; d++) {
      const el = document.createElement('div');
      el.className = 'day';
      el.innerHTML = '<span class="num">' + d + '</span>';

      const isPast = viewYear < today.getFullYear() ||
        (viewYear === today.getFullYear() && viewMonth < today.getMonth()) ||
        (isCurrentMonth && d < todayDate);
      const isToday = isCurrentMonth && d === todayDate;

      if (isPast) el.classList.add('done');
      else if (isToday) el.classList.add('today-day');
      else el.classList.add('future-day');

      grid.appendChild(el);
    }

    const note = document.getElementById('note');
    if (isCurrentMonth) {
      const left = total - todayDate;
      note.innerHTML = '<strong>' + left + ' days</strong> remaining';
    } else if (doneDays === total) {
      note.innerHTML = 'Month complete';
    } else {
      note.innerHTML = '';
    }
  }

  document.getElementById('prev').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render();
  });
  document.getElementById('next').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render();
  });

  render();
</script>
